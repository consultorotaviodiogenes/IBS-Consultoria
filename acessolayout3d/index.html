<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IBS | Layout CD 3D — Acesso</title>
<meta name="robots" content="noindex,nofollow">
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,'Segoe UI',sans-serif}
*{box-sizing:border-box}body{margin:0;background:#12161b;color:#e4e8ec;min-height:100vh;display:grid;place-items:center;padding:18px}
.panel{width:min(440px,100%);background:#181d23;border:1px solid #34404a;padding:28px;border-radius:13px;box-shadow:0 20px 65px #0008}
h1{margin:0;font-size:26px;letter-spacing:-.5px}h1 span{color:#f08a24}.subtitle{font-size:14px;color:#aebbc7;line-height:1.5;margin:12px 0 22px}
label{display:block;font-size:13px;color:#c8d1d9;margin-top:14px}input{width:100%;margin-top:6px;background:#202a33;border:1px solid #53616d;border-radius:6px;color:#fff;padding:12px;font-size:15px}
button{margin-top:22px;width:100%;background:#f08a24;border:0;padding:12px;border-radius:6px;color:#211305;font-weight:700;font-size:15px;cursor:pointer}button:disabled{opacity:.5;cursor:wait}
#status{min-height:40px;margin-top:18px;color:#b4c2ce;font-size:13px;line-height:1.5;white-space:pre-wrap}#status.error{color:#ff938a}
.footer{font-size:12px;color:#94a5b3;text-align:center;margin-top:14px}
</style>
</head>
<body>
<main class="panel">
  <h1>IBS Layout <span>CD 3D</span></h1>
  <p class="subtitle">Área exclusiva de clientes. Entre com seu e-mail e senha cadastrados para acessar o simulador.</p>
  <form id="login-form">
    <label for="email">E-mail</label><input id="email" type="email" required autocomplete="username" placeholder="seuemail@empresa.com.br">
    <label for="password">Senha</label><input id="password" type="password" required autocomplete="current-password" placeholder="Sua senha">
    <button id="login-button" type="submit">Entrar no simulador</button>
  </form>
  <div id="status" role="status" aria-live="polite">Preparando acesso seguro…</div>
  <div class="footer">Acesso sujeito à licença ativa · IBS Consultoria Logística</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(()=>{
'use strict';
const SUPABASE_URL='https://tgiwualvnjcdsvqbnmbw.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_HwDiksgm7HpLAkmyQKQDQA_ntspZYvg';
const status=document.getElementById('status');
const btn=document.getElementById('login-button');
const note=(message,error=false)=>{status.textContent=message;status.classList.toggle('error',error);};
if(!window.supabase?.createClient){note('Falha ao carregar o sistema de login. Verifique sua conexão.',true);return;}
const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
async function carregarSimulador(){
  const {data:{session},error}=await client.auth.getSession();
  if(error||!session?.access_token){note('Faça login para continuar.',true);return;}
  note('Verificando a licença e carregando o simulador…');
  const resposta=await fetch('/simulador',{method:'GET',headers:{'Authorization':'Bearer '+session.access_token},cache:'no-store'});
  if(!resposta.ok){
    let mensagem='Não foi possível abrir o simulador.';
    try{const json=await resposta.json(); mensagem=json.mensagem||json.message||mensagem;}catch{}
    if(resposta.status===401){await client.auth.signOut();}
    note(mensagem,true);return;
  }
  const html=await resposta.text();
  if(!/^\s*<!doctype html|^\s*<html/i.test(html)){note('Resposta inesperada do servidor.',true);return;}
  document.open();document.write(html);document.close();
}
document.getElementById('login-form').addEventListener('submit',async event=>{
 event.preventDefault();btn.disabled=true;note('Autenticando…');
 try{
  const {error}=await client.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});
  if(error)throw error;
  await carregarSimulador();
 }catch(error){note('Falha no acesso: '+(error?.message||'Tente novamente.'),true);}
 finally{btn.disabled=false;document.getElementById('password').value='';}
});
note('Informe suas credenciais para entrar.');
})();
</script>
</body>
</html>
